<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影作品 | Macmillan141</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2250,5 95,27 95,73 50,95 5,73 5,27%22 fill=%22%230a0a0f%22 stroke=%22%23dc143c%22 stroke-width=%223%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 fill=%22%23dc143c%22 font-size=%2250%22 font-family=%22serif%22>猬?/text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#dc143c;--dark:#0a0a0f;--text:#e0d0d0;--dim:#bbb;--bg-glass:rgba(12,12,22,0.35);--glass-border:rgba(220,20,60,0.12);--font:'STFangsong','FangSong','仿宋',serif;--font-mono:'Courier New',monospace}
body{font-family:var(--font);background:#111118;color:var(--text);font-size:28px;line-height:1.85;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--dark)}::-webkit-scrollbar-thumb{background:var(--red);border-radius:3px}
.bg-asuka{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-3;background:url('asuka.png') center/cover no-repeat;filter:brightness(0.45) saturate(1.05)}
.bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:radial-gradient(ellipse at 30% 20%,rgba(220,20,60,0.06),transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(0,255,65,0.02),transparent 50%),linear-gradient(180deg,rgba(6,6,12,0.1),rgba(6,6,12,0.55))}
.container{max-width:1200px;margin:0 auto;padding:20px;position:relative;z-index:1}

.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;padding:18px 24px;border:1px solid var(--glass-border)}
.topbar-left{display:flex;align-items:center;gap:14px}
.back-link{color:var(--red);text-decoration:none;font-size:22px;transition:all 0.3s}
.back-link:hover{color:#fff}
.page-title{font-size:1.5em;color:#fff;letter-spacing:2px}
.page-title span{color:var(--red)}
.page-sub{color:var(--dim);font-size:12px;letter-spacing:2px;font-family:var(--font-mono)}
.btn-add{background:var(--red);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:15px;letter-spacing:2px;font-family:var(--font-mono);transition:all 0.3s}
.btn-add:hover{background:#ff1a4d;box-shadow:0 0 20px rgba(220,20,60,0.4);transform:translateY(-2px)}

.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;margin-bottom:30px}
.photo-card{background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;overflow:hidden;border:1px solid var(--glass-border);transition:all 0.3s}
.photo-card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 12px 30px rgba(220,20,60,0.1)}
.photo-card img{width:100%;height:220px;object-fit:cover;display:block;border-bottom:1px solid var(--glass-border)}
.photo-info{padding:18px}
.photo-info h4{font-size:0.75em;color:var(--text);margin-bottom:6px;letter-spacing:1px}
.photo-info p{font-size:0.55em;color:var(--dim);line-height:1.7}
.photo-info .date{font-size:0.4em;color:var(--red);font-family:var(--font-mono);margin-top:8px}
.photo-actions{display:flex;gap:8px;padding:0 18px 14px}
.photo-actions button{background:transparent;border:1px solid var(--glass-border);color:var(--dim);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:1px;font-family:var(--font-mono);transition:all 0.3s}
.photo-actions .btn-edit:hover{color:var(--red);border-color:var(--red)}
.photo-actions .btn-del:hover{color:#ff4444;border-color:#ff4444}

.empty-state{text-align:center;padding:80px 20px;color:var(--dim);grid-column:1/-1}
.empty-state i{font-size:3em;color:var(--red);margin-bottom:16px;display:block;opacity:0.5}
.empty-state p{font-size:0.55em;letter-spacing:1px}

/* 批量预览网格 */
.batch-preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:12px;max-height:300px;overflow-y:auto;padding:4px}
.batch-preview-grid .thumb{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1;border:2px solid transparent;cursor:pointer;transition:all 0.2s}
.batch-preview-grid .thumb:hover,.batch-preview-grid .thumb.selected{border-color:var(--red)}
.batch-preview-grid .thumb img{width:100%;height:100%;object-fit:cover}
.batch-preview-grid .thumb .thumb-check{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px}
.batch-preview-grid .thumb.selected .thumb-check{background:var(--red)}
.batch-count{color:var(--red);font-size:13px;font-family:var(--font-mono);margin-top:8px;letter-spacing:1px}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:flex-start;padding-top:30px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:rgba(10,10,20,0.88);backdrop-filter:blur(30px);border:1px solid var(--red);border-radius:16px;padding:30px;width:90%;max-width:700px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal h3{font-size:1.3em;color:#fff;margin-bottom:20px;letter-spacing:2px}
.modal h3 span{color:var(--red)}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:6px;font-family:var(--font-mono);text-transform:uppercase}
.form-group input,.form-group textarea{width:100%;padding:12px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(220,20,60,0.2);border-radius:8px;color:var(--text);font-size:16px;font-family:var(--font);transition:all 0.3s;resize:vertical}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--red);background:rgba(220,20,60,0.05)}
.form-group textarea{min-height:80px}
.file-upload{border:2px dashed rgba(220,20,60,0.2);border-radius:12px;padding:30px;text-align:center;cursor:pointer;color:var(--dim);transition:all 0.3s;font-size:0.5em}
.file-upload:hover{border-color:var(--red);background:rgba(220,20,60,0.04);color:var(--red)}
.file-upload i{font-size:2em;margin-bottom:8px;display:block}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.btn-cancel{background:transparent;border:1px solid var(--glass-border);color:var(--dim);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:1px;font-family:var(--font-mono);transition:all 0.3s}
.btn-cancel:hover{color:#fff;border-color:#fff}
.btn-submit{background:var(--red);color:#fff;border:none;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;font-family:var(--font-mono);transition:all 0.3s}
.btn-submit:hover{background:#ff1a4d;box-shadow:0 0 20px rgba(220,20,60,0.4)}

/* Footer */
.footer{text-align:center;color:var(--dim);font-size:11px;letter-spacing:2px;padding:24px 0;font-family:var(--font-mono)}
.footer .accent{color:var(--red)}
#backTop{position:fixed;bottom:30px;right:30px;width:44px;height:44px;border-radius:50%;background:var(--bg-glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);color:var(--dim);font-size:18px;cursor:pointer;z-index:100;opacity:0;pointer-events:none;transition:all 0.3s;display:flex;align-items:center;justify-content:center}
#backTop.visible{opacity:1;pointer-events:all}
#backTop:hover{color:var(--red);border-color:var(--red)}

/* NERV loader */
#nervLoader{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.4s,visibility 0.4s}
#nervLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}
#nervLoader .logo{font-size:5em;color:var(--red);font-weight:bold;letter-spacing:6px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
</style>
</head>
<body>
<div id="nervLoader"><div class="logo">NERV</div></div>
<div class="bg-asuka"></div><div class="bg-gradient"></div>

<div class="container">
<div class="topbar">
<div class="topbar-left">
<a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回</a>
<div><div class="page-title"><span>■</span> 摄影作品</div><div class="page-sub">PHOTOGRAPHY GALLERY</div></div>
</div>
<button class="btn-add" onclick="openEditor(-1)"><i class="fas fa-plus"></i> 批量添加照片</button>
</div>

<div class="photo-grid" id="photoGrid"></div>

<button id="backTop" title="Back to top">▲</button>
<div class="footer"><span class="accent">Macmillan141</span> · 个人空间 · 摄影作品</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h3 id="modalTitle"><span>■</span> 添加照片</h3>

<div class="form-group">
<label>选择照片（支持多选）</label>
<div class="file-upload" id="fileUploadArea" onclick="document.getElementById('photoFile').click()">
<i class="fas fa-cloud-upload-alt"></i><span>点击选择照片 / 拖拽到此处</span>
<input type="file" id="photoFile" accept="image/*" multiple onchange="handleFile(this)" style="display:none">
</div>
<div id="batchPreview" style="margin-top:12px"></div>
</div>

<div class="form-group"><label>统一标题（选填，将用于所有照片）</label><input type="text" id="photoTitle" placeholder="例如：秋日街拍..."></div>
<div class="form-group"><label>统一描述（选填）</label><textarea id="photoDesc" placeholder="简单的描述..."></textarea></div>

<div class="form-actions">
<button class="btn-cancel" onclick="closeEditor()">取消</button>
<button class="btn-submit" id="btnSubmit" onclick="savePhoto()">保存全部</button>
</div>
</div>
</div>

<script>
var STORAGE_KEY = 'blog_photo_gallery';
var editingIdx = -1;
var batchFiles = []; // {dataUrl, filename}

function getPhotos(){var d=localStorage.getItem(STORAGE_KEY);return d?JSON.parse(d):[]}
function savePhotos(p){localStorage.setItem(STORAGE_KEY,JSON.stringify(p))}

function renderPhotos(){
var photos=getPhotos();
var grid=document.getElementById('photoGrid');
if(photos.length===0){grid.innerHTML='<div class="empty-state" id="emptyState"><i class="fas fa-camera-retro"></i><p>还没有作品，点击右上角「批量添加照片」</p></div>';return}
grid.innerHTML=photos.slice().reverse().map(function(p,idx){
var ri=photos.length-1-idx;
return '<div class="photo-card"><img src="'+p.image+'" alt="'+p.title+'"><div class="photo-info"><h4>'+p.title+'</h4><p>'+p.desc+'</p><div class="date">'+p.date+'</div></div><div class="photo-actions"><button class="btn-edit" onclick="openEditor('+ri+')"><i class="fas fa-edit"></i> 编辑</button><button class="btn-del" onclick="deletePhoto('+ri+')"><i class="fas fa-trash"></i> 删除</button></div></div>'
}).join('')
}

/* 批量文件处理 */
function handleFile(input){
var files=Array.from(input.files);
if(files.length===0)return;
// 限制总数
if(batchFiles.length+files.length > 20){alert('一次最多添加20张照片');input.value='';return}
var loaded=0;
files.forEach(function(file){
if(file.size>5*1024*1024){alert(file.name+' 超过5MB，已跳过');loaded++;return}
var reader=new FileReader();
reader.onload=function(e){
batchFiles.push({dataUrl:e.target.result,filename:file.name.replace(/.[^.]+$/,'')});
loaded++;
if(loaded===files.length)renderBatchPreview()
};
reader.readAsDataURL(file)
});
input.value=''
}

function renderBatchPreview(){
var el=document.getElementById('batchPreview');
if(batchFiles.length===0){el.innerHTML='';return}
el.innerHTML='<div class="batch-count">已选择 <strong>'+batchFiles.length+'</strong> 张照片（点击缩略图可移除）</div><div class="batch-preview-grid">'+
batchFiles.map(function(f,i){return '<div class="thumb selected" onclick="removeBatchFile('+i+')" title="'+f.filename+' - 点击移除"><img src="'+f.dataUrl+'"><div class="thumb-check"><i class="fas fa-times"></i></div></div>'}).join('')+
'</div>'
}

function removeBatchFile(i){batchFiles.splice(i,1);renderBatchPreview()}

function openEditor(idx){
editingIdx=idx;
batchFiles=[];
document.getElementById('batchPreview').innerHTML='';
document.getElementById('photoFile').value='';
document.getElementById('modalOverlay').classList.add('active');
if(idx>=0){
var photos=getPhotos();
var p=photos[idx];
document.getElementById('modalTitle').innerHTML='<span>■</span> 编辑照片';
document.getElementById('btnSubmit').textContent='保存修改';
document.getElementById('photoTitle').value=p.title;
document.getElementById('photoDesc').value=p.desc;
document.getElementById('fileUploadArea').style.display='none';
document.getElementById('batchPreview').innerHTML='<div class="batch-preview-grid"><div class="thumb selected"><img src="'+p.image+'"></div></div>'
}else{
document.getElementById('modalTitle').innerHTML='<span>■</span> 批量添加照片';
document.getElementById('btnSubmit').textContent='保存全部 ('+batchFiles.length+'张)';
document.getElementById('photoTitle').value='';
document.getElementById('photoDesc').value='';
document.getElementById('fileUploadArea').style.display='block';
document.getElementById('batchPreview').innerHTML=''
}
setTimeout(function(){document.getElementById('photoTitle').focus()},100)
}

function closeEditor(){
document.getElementById('modalOverlay').classList.remove('active');
editingIdx=-1;
batchFiles=[];
document.getElementById('fileUploadArea').style.display='block'
}

function savePhoto(){
var title=document.getElementById('photoTitle').value.trim();
var desc=document.getElementById('photoDesc').value.trim();
var now=new Date();
var dateStr=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
var photos=getPhotos();

if(editingIdx>=0){
photos[editingIdx].title=title||photos[editingIdx].title;
photos[editingIdx].desc=desc||photos[editingIdx].desc;
}else{
if(batchFiles.length===0){alert('请选择至少一张照片');return}
batchFiles.forEach(function(f){
photos.push({title:title||f.filename,desc:desc||'',image:f.dataUrl,date:dateStr})
})
}
savePhotos(photos);
renderPhotos();
closeEditor();

// 通知首页刷新
try{window.opener&&window.opener.refreshBlogPreviews&&window.opener.refreshBlogPreviews()}catch(e){}
window.dispatchEvent(new Event('photoUpdated'))
}

function deletePhoto(idx){
if(!confirm('确定删除这张照片？'))return;
var photos=getPhotos();
photos.splice(idx,1);
savePhotos(photos);
renderPhotos()
}

// 拖拽上传
var uploadArea=document.getElementById('fileUploadArea');
uploadArea.addEventListener('dragover',function(e){e.preventDefault();this.style.borderColor='var(--red)';this.style.background='rgba(220,20,60,0.06)'});
uploadArea.addEventListener('dragleave',function(e){e.preventDefault();this.style.borderColor='rgba(220,20,60,0.2)';this.style.background=''});
uploadArea.addEventListener('drop',function(e){e.preventDefault();this.style.borderColor='rgba(220,20,60,0.2)';this.style.background='';var dt=e.dataTransfer;if(dt.files.length>0){var inp=document.getElementById('photoFile');inp.files=dt.files;handleFile(inp)}});

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeEditor()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeEditor()});

var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){backTop.classList.toggle('visible',window.scrollY>400)});
backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('nervLoader').classList.add('hidden')},600)});

// 实时更新按钮文字
var origOpenEditor=openEditor;
openEditor=function(idx){
origOpenEditor(idx);
var btn=document.getElementById('btnSubmit');
if(idx<0){
var updater=setInterval(function(){
if(!document.getElementById('modalOverlay').classList.contains('active')){clearInterval(updater);return}
btn.textContent='保存全部 ('+batchFiles.length+'张)'
},300)
}
};

renderPhotos();
</script>
</body>
</html>
