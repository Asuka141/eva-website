<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>摄影作品 | Macmillan141</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><polygon points=%2250,5 95,27 95,73 50,95 5,73 5,27%22 fill=%22%230a0a0f%22 stroke=%22%23dc143c%22 stroke-width=%223%22/><text x=%2250%22 y=%2265%22 text-anchor=%22middle%22 fill=%22%23dc143c%22 font-size=%2250%22 font-family=%22serif%22>⬡</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#dc143c;--dark:#0a0a0f;--text:#e0d0d0;--dim:#bbb;--bg-glass:rgba(12,12,22,0.35);--glass-border:rgba(220,20,60,0.12);--font:'STFangsong','FangSong','仿宋',serif;--font-mono:'Courier New',monospace}
body{font-family:var(--font);background:#111118;color:var(--text);font-size:28px;line-height:1.85;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--dark)}::-webkit-scrollbar-thumb{background:var(--red);border-radius:3px}
.bg-asuka{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-3;background:url('asuka.png') center/cover no-repeat;filter:brightness(0.45) saturate(1.05)}
.bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;background:radial-gradient(ellipse at 30% 20%,rgba(220,20,60,0.06),transparent 55%),radial-gradient(ellipse at 70% 80%,rgba(0,255,65,0.02),transparent 50%),linear-gradient(180deg,rgba(6,6,12,0.1),rgba(6,6,12,0.55))}
.container{max-width:1200px;margin:0 auto;padding:20px;position:relative;z-index:1}

.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;padding:18px 24px;border:1px solid var(--glass-border)}
.topbar-left{display:flex;align-items:center;gap:14px}
.back-link{color:var(--red);text-decoration:none;font-size:22px;transition:all 0.3s}
.back-link:hover{color:#fff}
.page-title{font-size:1.5em;color:#fff;letter-spacing:2px}
.page-title span{color:var(--red)}
.page-sub{color:var(--dim);font-size:12px;letter-spacing:2px;font-family:var(--font-mono)}
.btn-add{background:var(--red);color:#fff;border:none;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:15px;letter-spacing:2px;font-family:var(--font-mono);transition:all 0.3s}
.btn-add:hover{background:#ff1a4d;box-shadow:0 0 20px rgba(220,20,60,0.4);transform:translateY(-2px)}

/* Photo grid */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;margin-bottom:30px}
.photo-card{background:var(--bg-glass);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:16px;overflow:hidden;border:1px solid var(--glass-border);transition:all 0.3s}
.photo-card:hover{transform:translateY(-4px);border-color:var(--red);box-shadow:0 12px 30px rgba(220,20,60,0.1)}
.photo-card img{width:100%;height:220px;object-fit:cover;display:block;border-bottom:1px solid var(--glass-border)}
.photo-info{padding:18px}
.photo-info h4{font-size:0.75em;color:var(--text);margin-bottom:6px;letter-spacing:1px}
.photo-info p{font-size:0.55em;color:var(--dim);line-height:1.7}
.photo-info .date{font-size:0.4em;color:var(--red);font-family:var(--font-mono);margin-top:8px}
.photo-actions{display:flex;gap:8px;padding:0 18px 14px}
.photo-actions button{background:transparent;border:1px solid var(--glass-border);color:var(--dim);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:1px;font-family:var(--font-mono);transition:all 0.3s}
.photo-actions .btn-edit:hover{color:var(--red);border-color:var(--red)}
.photo-actions .btn-del:hover{color:#ff4444;border-color:#ff4444}

.empty-state{text-align:center;padding:80px 20px;color:var(--dim);grid-column:1/-1}
.empty-state i{font-size:3em;color:var(--red);margin-bottom:16px;display:block;opacity:0.5}
.empty-state p{font-size:0.55em;letter-spacing:1px}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:1000;justify-content:center;align-items:flex-start;padding-top:40px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:rgba(10,10,20,0.85);backdrop-filter:blur(30px);border:1px solid var(--red);border-radius:16px;padding:30px;width:90%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal h3{font-size:1.3em;color:#fff;margin-bottom:20px;letter-spacing:2px}
.modal h3 span{color:var(--red)}
.form-group{margin-bottom:16px}
.form-group label{display:block;color:var(--dim);font-size:12px;letter-spacing:2px;margin-bottom:6px;font-family:var(--font-mono);text-transform:uppercase}
.form-group input,.form-group textarea{width:100%;padding:12px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);color:var(--text);font-size:15px;font-family:var(--font);border-radius:8px;outline:none;transition:all 0.3s;letter-spacing:1px}
.form-group input:focus,.form-group textarea:focus{border-color:var(--red);box-shadow:0 0 12px rgba(220,20,60,0.1)}
.form-group textarea{height:80px;resize:vertical}
.hint{font-size:11px;color:var(--dim);margin-top:4px}
.upload-area{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.upload-area input[type=file]{display:none}
.upload-label{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(220,20,60,0.12);border:1px dashed var(--red);color:var(--red);border-radius:8px;cursor:pointer;font-size:13px;letter-spacing:1px;transition:all 0.3s;font-family:var(--font-mono)}
.upload-label:hover{background:rgba(220,20,60,0.2);border-style:solid}
.upload-preview{max-width:200px;max-height:120px;border-radius:6px;border:1px solid var(--glass-border);display:none}
.form-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:20px}
.btn-cancel{background:transparent;border:1px solid var(--glass-border);color:var(--dim);padding:10px 24px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;font-family:var(--font-mono);transition:all 0.3s}
.btn-cancel:hover{border-color:var(--red);color:var(--red)}
.btn-submit{background:var(--red);color:#fff;border:none;padding:10px 28px;border-radius:8px;cursor:pointer;font-size:14px;letter-spacing:2px;font-family:var(--font-mono);transition:all 0.3s}
.btn-submit:hover{background:#ff1a4d;box-shadow:0 0 20px rgba(220,20,60,0.4)}

/* Loader */
#nervLoader{position:fixed;top:0;left:0;width:100%;height:100%;background:#06060e;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.6s,visibility 0.6s}
#nervLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}
#nervLoader .hex{font-size:80px;color:var(--red);animation:loaderPulse 1.5s ease-in-out infinite}
@keyframes loaderPulse{0%,100%{opacity:0.3;transform:scale(0.95)}50%{opacity:1;transform:scale(1.05)}}
#nervLoader .loader-text{margin-top:20px;font-family:var(--font-mono);color:var(--red);letter-spacing:6px;font-size:18px;animation:loaderBlink 0.8s step-end infinite}
@keyframes loaderBlink{0%,100%{opacity:1}50%{opacity:0}}
#nervLoader .loader-sub{color:var(--dim);font-size:11px;letter-spacing:3px;margin-top:8px;font-family:var(--font-mono)}
#nervLoader .loader-bar{width:200px;height:2px;background:rgba(255,255,255,0.05);margin-top:24px;border-radius:1px;overflow:hidden}
#nervLoader .loader-bar-fill{height:100%;background:var(--red);width:0;animation:loaderBar 0.8s ease-out forwards}
@keyframes loaderBar{0%{width:0}60%{width:85%}100%{width:100%}}

#backTop{position:fixed;bottom:80px;right:20px;z-index:998;width:40px;height:40px;background:rgba(220,20,60,0.15);border:1px solid var(--red);color:var(--red);border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:all 0.3s}
#backTop.visible{opacity:1;pointer-events:auto}
#backTop:hover{background:var(--red);color:#fff}

.footer{text-align:center;padding:30px;color:var(--dim);font-size:13px;letter-spacing:2px;margin-top:20px}
.footer .accent{color:var(--red)}

@media(max-width:768px){.container{padding:10px}.photo-grid{grid-template-columns:1fr}.modal{padding:20px;width:95%}.topbar{flex-direction:column;align-items:flex-start}}

#navBack{position:fixed;top:20px;left:20px;z-index:998;width:44px;height:44px;background:rgba(220,20,60,0.12);border:1px solid var(--red);color:var(--red);border-radius:8px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all 0.3s;text-decoration:none}
#navBack:hover{background:var(--red);color:#fff;box-shadow:0 0 15px rgba(220,20,60,0.3)}

</style>
</head>
<body>
<a href="index.html" id="navBack" title="Home">←</a>
<div id="nervLoader">
<div class="hex">⬡</div>
<div class="loader-text">NERV TERMINAL</div>
<div class="loader-sub">SYSTEM BOOT SEQUENCE</div>
<div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>
<div class="bg-asuka"></div><div class="bg-gradient"></div>

<div class="container">
<div class="topbar">
<div class="topbar-left">
<a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i></a>
<div><div class="page-title"><span>摄影作品</span></div><div class="page-sub">/// PHOTO_GALLERY</div></div>
</div>
<button class="btn-add" onclick="openEditor(-1)"><i class="fas fa-camera"></i> 添加照片</button>
</div>

<div class="photo-grid" id="photoGrid">
<div class="empty-state" id="emptyState"><i class="fas fa-camera-retro"></i><p>还没有作品，点击右上角「添加照片」</p></div>
</div>

<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h3 id="modalTitle"><span>⬡</span> 添加照片</h3>
<div class="form-group">
<label>照片</label>
<div class="upload-area">
<label class="upload-label" for="photoFile"><i class="fas fa-image"></i> 选择照片</label>
<input type="file" id="photoFile" accept="image/*" onchange="handleFile(this)">
<img class="upload-preview" id="photoPreview">
</div>
<div class="hint">选择本地照片（建议小于3MB）</div>
</div>
<div class="form-group"><label>标题</label><input type="text" id="photoTitle" placeholder="照片标题..."></div>
<div class="form-group"><label>描述</label><textarea id="photoDesc" placeholder="简单描述这张照片..."></textarea></div>
<div class="form-actions">
<button class="btn-cancel" onclick="closeEditor()">取消</button>
<button class="btn-submit" id="btnSubmit" onclick="savePhoto()">保存</button>
</div>
</div>
</div>

<button id="backTop" title="Back to top">▲</button>
<div class="footer"><span class="accent">Macmillan141</span> · 个人空间 · 摄影作品</div>
</div>

<script>
var STORAGE_KEY = 'blog_photo_gallery';
var editingIdx = -1;
var photoDataUrl = '';

function getPhotos(){
var d = localStorage.getItem(STORAGE_KEY);
return d ? JSON.parse(d) : [];
}
function savePhotos(p){localStorage.setItem(STORAGE_KEY,JSON.stringify(p))}

function renderPhotos(){
var photos = getPhotos();
var grid = document.getElementById('photoGrid');
var empty = document.getElementById('emptyState');
if(photos.length===0){
grid.innerHTML = '<div class="empty-state" id="emptyState"><i class="fas fa-camera-retro"></i><p>还没有作品，点击右上角「添加照片」</p></div>';
return
}
grid.innerHTML = photos.slice().reverse().map(function(p,idx){
var ri = photos.length-1-idx;
return '<div class="photo-card"><img src="'+p.image+'" alt="'+p.title+'"><div class="photo-info"><h4>'+p.title+'</h4><p>'+p.desc+'</p><div class="date">'+p.date+'</div></div><div class="photo-actions"><button class="btn-edit" onclick="openEditor('+ri+')"><i class="fas fa-edit"></i> 编辑</button><button class="btn-del" onclick="deletePhoto('+ri+')"><i class="fas fa-trash"></i> 删除</button></div></div>'
}).join('')
}

function handleFile(input){
var file = input.files[0];
if(!file) return;
if(file.size > 3*1024*1024){alert('照片不能超过3MB');input.value='';return}
var reader = new FileReader();
reader.onload = function(e){
photoDataUrl = e.target.result;
document.getElementById('photoPreview').src = photoDataUrl;
document.getElementById('photoPreview').style.display = 'block'
};
reader.readAsDataURL(file)
}

function openEditor(idx){
editingIdx = idx;
photoDataUrl = '';
document.getElementById('photoPreview').style.display = 'none';
document.getElementById('photoFile').value = '';
document.getElementById('modalOverlay').classList.add('active');
if(idx >= 0){
var photos = getPhotos();
var p = photos[idx];
document.getElementById('modalTitle').innerHTML = '<span>⬡</span> 编辑照片';
document.getElementById('btnSubmit').textContent = '保存修改';
document.getElementById('photoTitle').value = p.title;
document.getElementById('photoDesc').value = p.desc;
photoDataUrl = p.image;
document.getElementById('photoPreview').src = p.image;
document.getElementById('photoPreview').style.display = 'block'
}else{
document.getElementById('modalTitle').innerHTML = '<span>⬡</span> 添加照片';
document.getElementById('btnSubmit').textContent = '保存';
document.getElementById('photoTitle').value = '';
document.getElementById('photoDesc').value = ''
}
document.getElementById('photoTitle').focus()
}

function closeEditor(){
document.getElementById('modalOverlay').classList.remove('active');
editingIdx = -1;
photoDataUrl = ''
}

function savePhoto(){
var title = document.getElementById('photoTitle').value.trim()||'无标题';
var desc = document.getElementById('photoDesc').value.trim()||'';
if(!photoDataUrl && editingIdx < 0){alert('请选择一张照片');return}
var now = new Date();
var dateStr = now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');
var photos = getPhotos();
var photo = {title:title,desc:desc,image:photoDataUrl,date:dateStr};
if(editingIdx >= 0){
photo.date = photos[editingIdx].date;
if(!photoDataUrl) photo.image = photos[editingIdx].image;
photos[editingIdx] = photo
}else{photos.push(photo)}
savePhotos(photos);
renderPhotos();
closeEditor()
}

function deletePhoto(idx){
if(!confirm('确定删除这张照片？'))return;
var photos = getPhotos();
photos.splice(idx,1);
savePhotos(photos);
renderPhotos()
}

document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeEditor()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeEditor()});

var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){backTop.classList.toggle('visible',window.scrollY>400)});
backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})});
window.addEventListener('load',function(){setTimeout(function(){document.getElementById('nervLoader').classList.add('hidden')},600)});

renderPhotos();
</script>
</body>
</html>
